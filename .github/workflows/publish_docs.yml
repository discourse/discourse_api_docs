name: Publish Docs

# Builds docs.discourse.org from openapi.json and the MCP snapshot, and publishes it to GitHub
# Pages, each time main changes (the Update Docs pull requests included).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx sourcey build -o dist

      # Every file the site serves today keeps its address: openapi.json and openapi.yml, the
      # Bruno and Postman collections, the schemas, the logo the document names and the rest.
      # The reference above replaces only index.html.
      - name: Keep the repository's files at their addresses
        run: git ls-files -z | grep -zv -e '^\.github/' -e '^index\.html$' | xargs -0 cp --parents -n -t dist/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
